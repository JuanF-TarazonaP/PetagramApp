plugins {
    id 'com.android.application'
}

// Credenciales del correo: se leen de local.properties (que NO se sube a GitHub)
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.example.petagram'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.petagram"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "MAIL_USUARIO", "\"${localProps.getProperty('mail.usuario', '')}\""
        buildConfigField "String", "MAIL_PASSWORD", "\"${localProps.getProperty('mail.password', '')}\""
        buildConfigField "String", "MAIL_DESTINO", "\"${localProps.getProperty('mail.destino', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Evita conflictos de archivos duplicados de JavaMail
    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // JavaMail para Android
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Imagen redonda para la foto de perfil
    implementation 'com.mikhaellopez:circularimageview:4.3.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
